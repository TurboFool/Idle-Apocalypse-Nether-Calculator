<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idle Apocalypse - Nether Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts for premium fantasy typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0c0a0f;
            color: #f1f0f5;
        }
        .header-title {
            font-family: 'Cinzel', serif;
        }
        .mono-num {
            font-family: 'Space Mono', monospace;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #120f18;
        }
        ::-webkit-scrollbar-thumb {
            background: #3c2a52;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5d3f80;
        }
        /* Tap highlights */
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="overflow-x-hidden antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Custom SVGs for premium fantasy resource indicators
        const OrbIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stopColor="#f3e8ff" />
                        <stop offset="40%" stopColor="#d8b4fe" />
                        <stop offset="85%" stopColor="#7e22ce" />

                </defs>
                <circle cx="12" cy="12" r="10" fill="url(#orbGlow)" filter="drop-shadow(0 0 8px rgba(168, 85, 247, 0.6))" />
                <path d="M7 7.5C7.5 6 9 5 11 5" stroke="white" strokeWidth="1.5" strokeLinecap="round" opacity="0.6"/>

        const FlameIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stopColor="#b91c1c" />

                        <stop offset="80%" stopColor="#eab308" />
                        <stop offset="100%" stopColor="#fef08a" />
                    </linearGradient>
                </defs>
                <path d="M12 2C12 2 15 6 15 10C15 13.866 11.866 17 8 17C4.134 17 1 13.866 1 10C1 5.5 5 2 5 2C5 2 4 5 5 7C6 9 8 9.5 9 8C10 6.5 9.5 4.5 12 2Z" fill="url(#flameGrad)" filter="drop-shadow(0 0 6px rgba(234, 88, 12, 0.5))" />
                <path d="M14 8C14 8 17 11 17 14C17 17.314 14.314 20 11 20C7.686 20 5 17.314 5 14C5 11 8.5 8 8.5 8C8.5 8 7.5 10.5 8.5 12.5C9.5 14.5 11 14 11.5 13C12 12 11.5 10 14 8Z" fill="url(#flameGrad)" opacity="0.8" />

        const CrystalIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

                    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">

                </defs>
                <path d="M12 2L20 8L20 16L12 22L4 16L4 8L12 2Z" fill="url(#crystalGrad)" filter="drop-shadow(0 0 6px rgba(6, 182, 212, 0.4))" />
                <path d="M12 2V22M4 8H20M4 16H20" stroke="rgba(255,255,255,0.25)" strokeWidth="1" />
                <path d="M12 2L4 16L12 22L20 16L12 2Z" fill="white" opacity="0.1" />
            </svg>
        );

        const StarIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#fef08a" />
                        <stop offset="50%" stopColor="#eab308" />
                        <stop offset="100%" stopColor="#ca8a04" />
                    </linearGradient>
                </defs>
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="url(#starGrad)" filter="drop-shadow(0 0 6px rgba(234, 179, 8, 0.5))" />
                <path d="M12 4L14.2 9.1L19.5 9.8L15.5 13.7L16.5 19L12 16.5V4Z" fill="white" opacity="0.15" />
            </svg>
        );

        const MountainIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3L2 19H22L12 3Z" fill="#374151" stroke="#4B5563" strokeWidth="2" strokeLinejoin="round" />
                <path d="M12 3L7 19H17L12 3Z" fill="#1F2937" />
                <path d="M12 3L10 10L12 12L14 10L12 3Z" fill="#E5E7EB" opacity="0.9" />
                <circle cx="12" cy="7" r="1.5" fill="#F59E0B" />
            </svg>
        );

        // Pre-loaded verified data matching your Google Sheet exactly
        const DEFAULT_UPGRADES = [
            // NETHERLINGS
            { id: 'netherling_1', category: 'Creatures', name: 'Netherling Lvl 1', costOrbs: 5, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Unlocked' },
            { id: 'netherling_2', category: 'Creatures', name: 'Netherling Lvl 2', costOrbs: 0, costFlames: 0, costCrystals: 10, costStars: 0, defaultStatus: 'Unlocked' },
            { id: 'netherling_3', category: 'Creatures', name: 'Netherling Lvl 3', costOrbs: 0, costFlames: 60, costCrystals: 0, costStars: 3, defaultStatus: 'Unlocked' },
            { id: 'netherling_1_2', category: 'Creatures', name: 'Netherling Lvl 1-2', costOrbs: 5, costFlames: 0, costCrystals: 10, costStars: 0, defaultStatus: 'Unlocked' },
            { id: 'netherling_2_3', category: 'Creatures', name: 'Netherling Lvl 2-3', costOrbs: 0, costFlames: 60, costCrystals: 10, costStars: 3, defaultStatus: 'Unlocked' },
            { id: 'netherling_1_3', category: 'Creatures', name: 'Netherling Lvl 1-3', costOrbs: 5, costFlames: 60, costCrystals: 10, costStars: 3, defaultStatus: 'Unlocked' },

            // DEMONS
            { id: 'demon_1', category: 'Creatures', name: 'Demon Lvl 1', costOrbs: 10, costFlames: 40, costCrystals: 0, costStars: 0, defaultStatus: 'Unlocked' },
            { id: 'demon_2', category: 'Creatures', name: 'Demon Lvl 2', costOrbs: 0, costFlames: 0, costCrystals: 0, costStars: 4, defaultStatus: 'Unlocked' },
            { id: 'demon_3', category: 'Creatures', name: 'Demon Lvl 3', costOrbs: 0, costFlames: 0, costCrystals: 12, costStars: 6, defaultStatus: 'Unlocked' },
            { id: 'demon_1_2', category: 'Creatures', name: 'Demon Lvl 1-2', costOrbs: 10, costFlames: 40, costCrystals: 0, costStars: 4, defaultStatus: 'Unlocked' },
            { id: 'demon_2_3', category: 'Creatures', name: 'Demon Lvl 2-3', costOrbs: 0, costFlames: 0, costCrystals: 12, costStars: 10, defaultStatus: 'Unlocked' },
            { id: 'demon_1_3', category: 'Creatures', name: 'Demon Lvl 1-3', costOrbs: 10, costFlames: 40, costCrystals: 12, costStars: 10, defaultStatus: 'Unlocked' },

            // MOUNTAINS (Snowy peaks - only two levels exist)
            { id: 'mountain_1', category: 'Creatures', name: 'Mountain Lvl 1', costOrbs: 10, costFlames: 50, costCrystals: 25, costStars: 0, defaultStatus: 'Locked' },
            { id: 'mountain_2', category: 'Creatures', name: 'Mountain Lvl 2', costOrbs: 0, costFlames: 50, costCrystals: 25, costStars: 15, defaultStatus: 'Locked' },
            { id: 'mountain_1_2', category: 'Creatures', name: 'Mountain Lvl 1-2', costOrbs: 10, costFlames: 100, costCrystals: 50, costStars: 15, defaultStatus: 'Locked' },

            // SCROLLS (Matched 100% to your sheet)
            { id: 'scroll_plenty', category: 'Scrolls', name: 'Plenty', costOrbs: 10, costFlames: 25, costCrystals: 10, costStars: 0, defaultStatus: 'Locked' },
            { id: 'scroll_industry', category: 'Scrolls', name: 'Industry', costOrbs: 10, costFlames: 25, costCrystals: 10, costStars: 0, defaultStatus: 'Locked' },
            { id: 'scroll_might', category: 'Scrolls', name: 'Might', costOrbs: 0, costFlames: 50, costCrystals: 25, costStars: 10, defaultStatus: 'Locked' },
            { id: 'scroll_dark', category: 'Scrolls', name: 'Dark', costOrbs: 0, costFlames: 50, costCrystals: 25, costStars: 10, defaultStatus: 'Locked' },
            { id: 'scroll_magic', category: 'Scrolls', name: 'Magic', costOrbs: 0, costFlames: 0, costCrystals: 25, costStars: 15, defaultStatus: 'Locked' },
            { id: 'scroll_unending', category: 'Scrolls', name: 'Unending', costOrbs: 0, costFlames: 0, costCrystals: 50, costStars: 15, defaultStatus: 'Locked' },
            { id: 'scroll_growth', category: 'Scrolls', name: 'Growth', costOrbs: 0, costFlames: 0, costCrystals: 50, costStars: 15, defaultStatus: 'Locked' },
            { id: 'scroll_dead', category: 'Scrolls', name: 'Dead', costOrbs: 20, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' },
            { id: 'scroll_troll', category: 'Scrolls', name: 'Troll', costOrbs: 20, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' },
            { id: 'scroll_scales', category: 'Scrolls', name: 'Scales', costOrbs: 20, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' },
            { id: 'scroll_time', category: 'Scrolls', name: 'Time', costOrbs: 20, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' },
            { id: 'scroll_nature', category: 'Scrolls', name: 'Nature', costOrbs: 0, costFlames: 100, costCrystals: 50, costStars: 20, defaultStatus: 'Locked' },
            { id: 'scroll_nether', category: 'Scrolls', name: 'Nether', costOrbs: 0, costFlames: 150, costCrystals: 75, costStars: 25, defaultStatus: 'Locked' },

            // DOOMSDAY DEVICE (DDD)
            { id: 'ddd_5', category: 'DDD', name: 'DDD Lvl 5', costOrbs: 10, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' },
            { id: 'ddd_6', category: 'DDD', name: 'DDD Lvl 6', costOrbs: 10, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' },
            { id: 'ddd_5_6', category: 'DDD', name: 'DDD Lvl 5-6', costOrbs: 20, costFlames: 0, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' },
            { id: 'ddd_7', category: 'DDD', name: 'DDD Lvl 7', costOrbs: 10, costFlames: 50, costCrystals: 25, costStars: 0, defaultStatus: 'Locked' },
            { id: 'ddd_6_7', category: 'DDD', name: 'DDD Lvl 6-7', costOrbs: 20, costFlames: 50, costCrystals: 25, costStars: 0, defaultStatus: 'Locked' },
            { id: 'ddd_8', category: 'DDD', name: 'DDD Lvl 8', costOrbs: 0, costFlames: 100, costCrystals: 50, costStars: 25, defaultStatus: 'Locked' },
            { id: 'ddd_7_8', category: 'DDD', name: 'DDD Lvl 7-8', costOrbs: 10, costFlames: 150, costCrystals: 75, costStars: 25, defaultStatus: 'Locked' },
            { id: 'ddd_9', category: 'DDD', name: 'DDD Lvl 9', costOrbs: 0, costFlames: 150, costCrystals: 75, costStars: 25, defaultStatus: 'Locked' },
            { id: 'ddd_10', category: 'DDD', name: 'DDD Lvl 10', costOrbs: 0, costFlames: 150, costCrystals: 75, costStars: 75, defaultStatus: 'Locked' },
            { id: 'ddd_8_10', category: 'DDD', name: 'DDD Lvl 8-10', costOrbs: 0, costFlames: 0, costCrystals: 50, costStars: 75, defaultStatus: 'Locked' },
            { id: 'ddd_7_10', category: 'DDD', name: 'DDD Lvl 7-10', costOrbs: 10, costFlames: 150, costCrystals: 75, costStars: 75, defaultStatus: 'Locked' },

            // SPECIALS & COMPOSITES
            { id: 'scrolls_ddd', category: 'Specials', name: 'Scrolls & DDD (Combined)', costOrbs: 0, costFlames: 555, costCrystals: 155, costStars: 88, defaultStatus: 'Locked' },
            { id: 'ankh_1', category: 'Specials', name: '1 Ankh Upgrade', costOrbs: 0, costFlames: 0, costCrystals: 0, costStars: 0, notes: "Requires 9 Netherlings & 2-3 Mountains", defaultStatus: 'Locked' },
            { id: 'lesley_stars', category: 'Specials', name: 'Lesley (50 Stars)', costOrbs: 0, costFlames: 0, costCrystals: 0, costStars: 50, defaultStatus: 'Locked' },
            { id: 'lesley_flames', category: 'Specials', name: 'Lesley (100 Flames)', costOrbs: 0, costFlames: 100, costCrystals: 0, costStars: 0, defaultStatus: 'Locked' }
        ];

        function App() {
            // State
            const [onHand, setOnHand] = useState({
                flames: 34,
                crystals: 9,
                stars: 2,
                orbs: 21
            });

            // Active Goal focus tracker for ADHD relief/breakdown viewing
            const [focusedGoalId, setFocusedGoalId] = useState(null);

            // Cache validation version tag to cleanly wipe corrupt state
            const CACHE_VERSION = "v3_exact_scrolls";

            const [upgrades, setUpgrades] = useState(() => {
                const storedVersion = localStorage.getItem('idle_apoc_cache_version');
                const local = localStorage.getItem('idle_apoc_nether_upgrades');

                // If cache version doesn't match, reload correct default database to guarantee all 13 scrolls exist
                if (storedVersion !== CACHE_VERSION || !local) {
                    localStorage.setItem('idle_apoc_cache_version', CACHE_VERSION);
                    localStorage.setItem('idle_apoc_nether_upgrades', JSON.stringify(DEFAULT_UPGRADES));
                    return DEFAULT_UPGRADES;
                }

                try {
                    const parsed = JSON.parse(local);
                    // Filter out old hallucinated elements & merge correctly
                    const merged = DEFAULT_UPGRADES.map(defU => {
                        const existing = parsed.find(u => u.id === defU.id);
                        if (existing) {
                            return {
                                ...defU,
                                status: existing.status || defU.defaultStatus
                            };
                        }
                        return defU;
                    });
                    return merged;
                } catch (e) {
                    return DEFAULT_UPGRADES;
                }
            });

            // Summon configurations (boost multipliers)
            const [summonRates, setSummonRates] = useState({
                netherling: 8,
                demon: 5,
                mountain: 3
            });

            const [activeTab, setActiveTab] = useState('summary'); // 'summary', 'upgrades', 'sync'
            const [targetFilter, setTargetFilter] = useState('All'); // 'All', 'Creatures', 'Scrolls', 'DDD', 'Specials'
            const [notification, setNotification] = useState(null);
            const [customItemName, setCustomItemName] = useState('');
            const [customItemCost, setCustomItemCost] = useState({ orbs: 0, flames: 0, crystals: 0, stars: 0 });

            // Save state hooks
            useEffect(() => {
                localStorage.setItem('idle_apoc_nether_upgrades', JSON.stringify(upgrades));
            }, [upgrades]);

            useEffect(() => {
                const storedOnHand = localStorage.getItem('idle_apoc_nether_onhand');
                if (storedOnHand) {
                    setOnHand(JSON.parse(storedOnHand));
                }
            }, []);

            const saveOnHand = (newOnHand) => {
                setOnHand(newOnHand);
                localStorage.setItem('idle_apoc_nether_onhand', JSON.stringify(newOnHand));
            };

            // Trigger animations notifications
            const showNotify = (text, type = 'success') => {
                setNotification({ text, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleResetAll = () => {
                if (window.confirm("Are you sure you want to reset everything back to the default cost sheet values?")) {
                    saveOnHand({ flames: 34, crystals: 9, stars: 2, orbs: 21 });
                    setUpgrades(DEFAULT_UPGRADES);
                    setFocusedGoalId(null);
                    showNotify("Reset to default sheet data!");
                }
            };

            const updateOnHandValue = (key, delta) => {
                const updated = {
                    ...onHand,
                    [key]: Math.max(0, onHand[key] + delta)
                };
                saveOnHand(updated);
            };

            // Toggle target upgrade states
            const cycleStatus = (id) => {
                const updated = upgrades.map(u => {
                    if (u.id === id) {
                        let nextStatus = 'Unlocked';
                        const current = u.status || u.defaultStatus;
                        
                        if (current === 'Unlocked') nextStatus = 'Needed';
                        else if (current === 'Needed') nextStatus = 'Locked';
                        else nextStatus = 'Unlocked';

                        return { ...u, status: nextStatus };
                    }
                    return u;
                });
                setUpgrades(updated);
            };

            // Custom user targets creator
            const handleAddCustomItem = (e) => {
                e.preventDefault();
                if (!customItemName.trim()) return;

                const newItem = {
                    id: 'custom_' + Date.now(),
                    category: 'Specials',
                    name: customItemName.trim(),
                    costOrbs: Number(customItemCost.orbs) || 0,
                    costFlames: Number(customItemCost.flames) || 0,
                    costCrystals: Number(customItemCost.crystals) || 0,
                    costStars: Number(customItemCost.stars) || 0,
                    status: 'Needed'
                };

                setUpgrades([...upgrades, newItem]);
                setCustomItemName('');
                setCustomItemCost({ orbs: 0, flames: 0, crystals: 0, stars: 0 });
                showNotify(`Added "${newItem.name}" to Goals!`);
            };

            const handleDeleteItem = (id) => {
                setUpgrades(upgrades.filter(u => u.id !== id));
                showNotify("Custom item removed.");
            };

            // Dynamic Adaptive CSV Parser - easily maps columns for both standard layout formats!
            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    parseAndLoadCSV(text);
                };
                reader.readAsText(file);
            };

            const parseAndLoadCSV = (csvText) => {
                try {
                    const rows = csvText.split(/\r?\n/).map(row => {
                        return row.split(',').map(cell => cell.replace(/^["']|["']$/g, '').trim());
                    });

                    let foundOnHand = false;
                    let newOnHand = { ...onHand };
                    let updatedUpgrades = [...upgrades];

                    // Check if file is "Nether Costs.csv" style containing "status" header row
                    const isNetherCostsFormat = rows.some(r => r.some(cell => cell.toLowerCase().includes('status')));

                    // Define dynamically shifted column offsets based on structure format
                    const nameColIdx = isNetherCostsFormat ? 1 : 0;
                    const levelColIdx = isNetherCostsFormat ? 2 : 1;
                    const statusColIdx = isNetherCostsFormat ? 3 : -1;
                    const flameColIdx = isNetherCostsFormat ? 4 : 2;
                    const crystalColIdx = isNetherCostsFormat ? 5 : 3;
                    const starColIdx = isNetherCostsFormat ? 6 : 4;
                    const orbColIdx = isNetherCostsFormat ? 7 : 5;

                    let currentParentCreature = "";

                    for (let r = 0; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row || row.length < 3) continue;

                        // Check for Inventory marker row
                        const isOnHandHeader = row.some(cell => cell.toLowerCase().includes('on hand'));
                        if (isOnHandHeader) {
                            const headersRow = rows[r+1] || [];
                            const valuesRow = rows[r+2] || [];

                            headersRow.forEach((header, index) => {
                                const lowerHeader = header.toLowerCase();
                                const parsedVal = parseInt(valuesRow[index], 10);
                                if (!isNaN(parsedVal)) {
                                    if (lowerHeader.includes('flame')) newOnHand.flames = parsedVal;
                                    if (lowerHeader.includes('crystal')) newOnHand.crystals = parsedVal;
                                    if (lowerHeader.includes('star')) newOnHand.stars = parsedVal;
                                    if (lowerHeader.includes('orb')) newOnHand.orbs = parsedVal;
                                }
                            });
                            foundOnHand = true;
                        }

                        // Parse Upgrades / Scrolls / DDD levels
                        const cellA = row[nameColIdx];
                        const cellB = row[levelColIdx];

                        if (cellA || cellB) {
                            // Update current creature group header to map sub-levels (e.g. Netherling, Demon, Mountain)
                            if (cellA && ["netherling", "demon", "mountain", "ddd"].some(keyword => cellA.toLowerCase().includes(keyword))) {
                                currentParentCreature = cellA;
                            }

                            // Match row against default upgrade catalog
                            const matchedIdx = updatedUpgrades.findIndex(u => {
                                const uNameClean = u.name.toLowerCase().replace(/\s/g, '');
                                if (cellA) {
                                    const cellAClean = cellA.toLowerCase().replace(/\s/g, '');
                                    // Direct match for single scrolls or special groups
                                    if (uNameClean === cellAClean) return true;
                                    if (cellB && uNameClean.includes(cellAClean) && uNameClean.includes(cellB.toLowerCase().replace(/\s/g, ''))) return true;
                                }
                                // Match levels with inherited parents (e.g. Netherling level 3)
                                if (cellB && currentParentCreature) {
                                    const parentClean = currentParentCreature.toLowerCase().replace(/\s/g, '');
                                    const levelClean = cellB.toLowerCase().replace(/\s/g, '');
                                    return uNameClean.includes(parentClean) && uNameClean.endsWith(`lvl${levelClean}`);
                                }
                                return false;
                            });

                            if (matchedIdx !== -1) {
                                // Extract status mapped from sheet
                                if (statusColIdx !== -1 && row[statusColIdx]) {
                                    const scLower = row[statusColIdx].toLowerCase();
                                    if (scLower.includes('unlock')) updatedUpgrades[matchedIdx].status = 'Unlocked';
                                    else if (scLower.includes('need')) updatedUpgrades[matchedIdx].status = 'Needed';
                                    else if (scLower.includes('lock')) updatedUpgrades[matchedIdx].status = 'Locked';
                                }

                                // Fetch corrected costs from sheet row properties
                                const fCost = parseInt(row[flameColIdx], 10);
                                const cCost = parseInt(row[crystalColIdx], 10);
                                const sCost = parseInt(row[starColIdx], 10);
                                const oCost = parseInt(row[orbColIdx], 10);

                                updatedUpgrades[matchedIdx] = {
                                    ...updatedUpgrades[matchedIdx],
                                    costFlames: !isNaN(fCost) ? fCost : updatedUpgrades[matchedIdx].costFlames,
                                    costCrystals: !isNaN(cCost) ? cCost : updatedUpgrades[matchedIdx].costCrystals,
                                    costStars: !isNaN(sCost) ? sCost : updatedUpgrades[matchedIdx].costStars,
                                    costOrbs: !isNaN(oCost) ? oCost : updatedUpgrades[matchedIdx].costOrbs,
                                };
                            }
                        }
                    }

                    setUpgrades(updatedUpgrades);
                    if (foundOnHand) {
                        saveOnHand(newOnHand);
                        showNotify("Inventory & Upgrades synchronized successfully!");
                    } else {
                        showNotify("Cost targets loaded. Setup 'On Hand' inventory row in sheet to import counts.", "success");
                    }
                } catch (error) {
                    console.error(error);
                    showNotify("Error parsing CSV. Please check formatting.", "error");
                }
            };

            // Totals of active needed cost targets
            const totalsNeededDirectly = useMemo(() => {
                let orbs = 0;
                let flames = 0;
                let crystals = 0;
                let stars = 0;

                upgrades.forEach(u => {
                    const status = u.status || u.defaultStatus;
                    if (status === 'Needed') {
                        orbs += u.costOrbs || 0;
                        flames += u.costFlames || 0;
                        crystals += u.costCrystals || 0;
                        stars += u.costStars || 0;
                    }
                });

                return { orbs, flames, crystals, stars };
            }, [upgrades]);

            const activeNeededGoals = useMemo(() => {
                return upgrades.filter(u => (u.status || u.defaultStatus) === 'Needed');
            }, [upgrades]);

            // If focused goal is deleted or unlocked, fallback to first active goal
            useEffect(() => {
                if (focusedGoalId && !activeNeededGoals.some(g => g.id === focusedGoalId)) {
                    setFocusedGoalId(activeNeededGoals[0]?.id || null);
                } else if (!focusedGoalId && activeNeededGoals.length > 0) {
                    setFocusedGoalId(activeNeededGoals[0].id);
                }
            }, [activeNeededGoals, focusedGoalId]);

            // Cascading Summon Math Engine
            const strategy = useMemo(() => {
                const baseStars = totalsNeededDirectly.stars;
                const baseCrystals = totalsNeededDirectly.crystals;
                const baseFlames = totalsNeededDirectly.flames;
                const baseOrbs = totalsNeededDirectly.orbs;

                // 1. Mountains (produces Stars)
                const starDeficit = Math.max(0, baseStars - onHand.stars);
                const starsPerSummon = summonRates.mountain;
                const mountainsToSummon = starDeficit > 0 ? Math.ceil(starDeficit / starsPerSummon) : 0;
                const mountainGainedStars = mountainsToSummon * starsPerSummon;
                
                const mountainOrbCost = mountainsToSummon * 5;
                const mountainCrystalCost = mountainsToSummon * 3;

                // 2. Demons (produces Crystals)
                const totalTargetCrystals = baseCrystals + mountainCrystalCost;
                const crystalDeficit = Math.max(0, totalTargetCrystals - onHand.crystals);
                const crystalsPerSummon = summonRates.demon;
                const demonsToSummon = crystalDeficit > 0 ? Math.ceil(crystalDeficit / crystalsPerSummon) : 0;
                const demonGainedCrystals = demonsToSummon * crystalsPerSummon;

                const demonOrbCost = demonsToSummon * 3;
                const demonFlameCost = demonsToSummon * 5;

                // 3. Netherlings (produces Flames)
                const totalTargetFlames = baseFlames + demonFlameCost;
                const flameDeficit = Math.max(0, totalTargetFlames - onHand.flames);
                const flamesPerSummon = summonRates.netherling;
                const netherlingsToSummon = flameDeficit > 0 ? Math.ceil(flameDeficit / flamesPerSummon) : 0;
                const netherlingGainedFlames = netherlingsToSummon * flamesPerSummon;

                const netherlingOrbCost = netherlingsToSummon * 1;

                // 4. Total Orbs required
                const totalTargetOrbs = baseOrbs + mountainOrbCost + demonOrbCost + netherlingOrbCost;
                const orbDeficit = Math.max(0, totalTargetOrbs - onHand.orbs);

                return {
                    mountains: mountainsToSummon,
                    demons: demonsToSummon,
                    netherlings: netherlingsToSummon,
                    totalOrbsNeeded: totalTargetOrbs,
                    orbDeficit,
                    gainedStars: mountainGainedStars,
                    gainedCrystals: demonGainedCrystals,
                    gainedFlames: netherlingGainedFlames,
                    mountainCrystalCost,
                    demonFlameCost
                };
            }, [totalsNeededDirectly, onHand, summonRates]);

            // Focus targets calculator - isolates calculation parameters for a single selected goal

                const goal = upgrades.find(u => u.id === focusedGoalId);
                if (!goal) return null;

                const baseCrystals = goal.costCrystals || 0;
                const baseFlames = goal.costFlames || 0;
                const baseOrbs = goal.costOrbs || 0;

                const mToSummon = baseStars > 0 ? Math.ceil(Math.max(0, baseStars - onHand.stars) / summonRates.mountain) : 0;
                const mCrystalCost = mToSummon * 3;

                const dToSummon = (baseCrystals + mCrystalCost) > 0 ? Math.ceil(Math.max(0, (baseCrystals + mCrystalCost) - onHand.crystals) / summonRates.demon) : 0;
                const dFlameCost = dToSummon * 5;

                const nToSummon = (baseFlames + dFlameCost) > 0 ? Math.ceil(Math.max(0, (baseFlames + dFlameCost) - onHand.flames) / summonRates.netherling) : 0;

                const totalOrbsNeeded = baseOrbs + (mToSummon * 5) + (dToSummon * 3) + (nToSummon * 1);

                    goalName: goal.name,
                    category: goal.category,
                    mountains: mToSummon,
                    demons: dToSummon,
                    netherlings: nToSummon,
                    orbs: totalOrbsNeeded,
                    orbsDeficit: Math.max(0, totalOrbsNeeded - onHand.orbs)
                };

                return Math.min(100, Math.round((onHand.orbs / strategy.totalOrbsNeeded) * 100));

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
