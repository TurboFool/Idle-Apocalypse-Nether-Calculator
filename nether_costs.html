<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Idle Apocalypse - Nether Costs Calculator</title>
    <!-- Premium Fantasy & Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Variables & Theme */
        :root {
            --bg-color: #0d0a12;
            --panel-bg: #14101e;
            --panel-border: rgba(168, 85, 247, 0.2);
            --text-color: #f3f1f7;
            --text-muted: #bdaecf;
            
            /* Resource Colors & Glows */
            --color-orb: #d8b4fe;
            --glow-orb: rgba(168, 85, 247, 0.4);
            
            --color-flame: #ea580c;
            --glow-flame: rgba(234, 88, 12, 0.4);
            
            --color-crystal: #06b6d4;
            --glow-crystal: rgba(6, 182, 212, 0.4);
            
            --color-star: #eab308;
            --glow-star: rgba(234, 179, 8, 0.4);

            --accent-purple: #8b5cf6;
        }

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-fantasy {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
        }

        .mono-num {
            font-family: 'Space Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #09070c;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b1f3c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #473263;
        }

        /* Containers */
        .header {
            border-bottom: 2px solid rgba(139, 92, 246, 0.2);
            background-color: rgba(20, 16, 30, 0.95);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 12px 16px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            box-shadow: 0 0 12px var(--glow-orb);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            display: flex;
            align-items: center;
        }

        .version-tag {
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #d8b4fe;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            text-shadow: none;
            letter-spacing: 0;
            font-family: 'Space Mono', monospace;
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .actions-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            background: #2b1f3c;
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            background: #3c2a55;
            border-color: var(--accent-purple);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-danger {
            border-color: rgba(220, 38, 38, 0.4);
        }
        .btn-danger:hover {
            background: rgba(220, 38, 38, 0.2);
            border-color: #dc2626;
        }

        .main-layout {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Panels layout */
        @media (min-width: 950px) {
            .main-layout {
                display: grid;
                grid-template-columns: 460px 1fr;
                align-items: start;
            }
            .sticky-panel {
                position: sticky;
                top: 90px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                max-height: calc(100vh - 120px);
                overflow-y: auto;
                padding-right: 4px;
            }
        }

        /* Common Panel Styling */
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(139, 92, 246, 0.1);
            padding-bottom: 8px;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #fff;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Collapsible Modifiers CSS */
        .collapsible-trigger {
            background: none;
            border: none;
            color: var(--accent-purple);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .collapsible-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .collapsible-content.expanded {
            max-height: 500px;
            margin-top: 12px;
            border-top: 1px dashed rgba(168, 85, 247, 0.15);
            padding-top: 12px;
        }

        .modifiers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modifier-box {
            background: rgba(13, 10, 18, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.1);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modifier-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .modifier-value {
            color: #fff;
            font-weight: bold;
        }

        .modifier-desc {
            font-size: 0.65rem;
            color: #a78bfa;
            font-style: italic;
        }

        /* Toggle Button styling */
        .toggle-btn {
            background: #1e152d;
            border: 1px solid rgba(168, 85, 247, 0.2);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 700;
            text-align: center;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
            border-color: #a78bfa;
        }

        /* Range slider styling */
        .range-slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .range-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #1e152d;
            border-radius: 3px;
            outline: none;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-purple);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(139, 92, 246, 0.6);
            border: 2px solid #fff;
        }

        /* Inventory Panel Grid */
        .inventory-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 480px) {
            .inventory-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .inventory-card {
            background: rgba(13, 10, 18, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 125px;
            position: relative;
            transition: box-shadow 0.3s;
        }

        .card-shortcuts {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            justify-content: center;
        }

        .shortcut-btn {
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 6px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            user-select: none;
        }

        .shortcut-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.35);
        }

        /* Card color codes */
        .inv-orb { border-color: rgba(168, 85, 247, 0.25); }
        .inv-orb:focus-within, .inv-orb:hover { box-shadow: 0 0 10px var(--glow-orb); border-color: var(--color-orb); }

        .inv-flame { border-color: rgba(234, 88, 12, 0.25); }
        .inv-flame:focus-within, .inv-flame:hover { box-shadow: 0 0 10px var(--glow-flame); border-color: var(--color-flame); }

        .inv-crystal { border-color: rgba(6, 182, 212, 0.25); }
        .inv-crystal:focus-within, .inv-crystal:hover { box-shadow: 0 0 10px var(--glow-crystal); border-color: var(--color-crystal); }

        .inv-star { border-color: rgba(234, 179, 8, 0.25); }
        .inv-star:focus-within, .inv-star:hover { box-shadow: 0 0 10px var(--glow-star); border-color: var(--color-star); }

        .creature-drop-card {
            background: rgba(13, 10, 18, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .creature-drop-card:hover {
            transform: translateY(-2px);
        }
        .drop-card-netherling { border-color: rgba(234, 88, 12, 0.25); }
        .drop-card-netherling:hover { box-shadow: 0 0 10px var(--glow-flame); border-color: var(--color-flame); }
        .drop-card-demon { border-color: rgba(6, 182, 212, 0.25); }
        .drop-card-demon:hover { box-shadow: 0 0 10px var(--glow-crystal); border-color: var(--color-crystal); }
        .drop-card-mountain { border-color: rgba(234, 179, 8, 0.25); }
        .drop-card-mountain:hover { box-shadow: 0 0 10px var(--glow-star); border-color: var(--color-star); }

        .card-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .resource-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .card-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-top: 8px;
        }

        .card-btn {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.15);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .card-btn:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
        }

        .inv-input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 800;
            outline: none;
        }

        /* Remove arrows from number input */
        .inv-input::-webkit-outer-spin-button,
        .inv-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .inv-input[type=number] {
            -moz-appearance: textfield;
        }

        /* Calculator Results Card */
        .results-panel {
            background: linear-gradient(135deg, #1b132a, #0e0915);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
        }

        .results-section-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #a78bfa;
            letter-spacing: 0.05rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .summons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .summon-item {
            background: rgba(13, 10, 18, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .summon-creature-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .summon-count {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
        }

        .summon-name {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .deficits-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .deficit-item {
            background: rgba(13, 10, 18, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .deficit-item.deficit-active {
            background: rgba(220, 38, 38, 0.05);
        }
        .deficit-item.deficit-active.def-orb { border-color: rgba(168, 85, 247, 0.4); }
        .deficit-item.deficit-active.def-flame { border-color: rgba(234, 88, 12, 0.4); }
        .deficit-item.deficit-active.def-crystal { border-color: rgba(6, 182, 212, 0.4); }
        .deficit-item.deficit-active.def-star { border-color: rgba(234, 179, 8, 0.4); }

        .deficit-val {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-muted);
        }
        .deficit-active .deficit-val {
            color: #fff;
            animation: text-glow 1.5s infinite alternate ease-in-out;
        }
        .deficit-active.def-orb .deficit-val { text-shadow: 0 0 6px var(--color-orb); }
        .deficit-active.def-flame .deficit-val { text-shadow: 0 0 6px var(--color-flame); }
        .deficit-active.def-crystal .deficit-val { text-shadow: 0 0 6px var(--color-crystal); }
        .deficit-active.def-star .deficit-val { text-shadow: 0 0 6px var(--color-star); }

        .deficit-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* Narrative Explanation Log */
        .explanation-box {
            background: rgba(9, 7, 12, 0.8);
            border: 1px dashed rgba(168, 85, 247, 0.2);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
            max-height: 140px;
            overflow-y: auto;
        }

        .explanation-step {
            margin-bottom: 6px;
            padding-left: 10px;
            border-left: 2px solid var(--accent-purple);
        }
        .explanation-step:last-child {
            margin-bottom: 0;
        }

        /* Right Column Checklist Panel */
        .checklist-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            background: rgba(13, 10, 18, 0.4);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(168, 85, 247, 0.1);
        }

        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-tab {
            background: #191426;
            border: 1px solid rgba(168, 85, 247, 0.15);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab.active {
            background: var(--accent-purple);
            color: #fff;
            border-color: #a78bfa;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: #0d0a12;
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.2);
        }

        .checkbox-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            color: var(--text-muted);
        }

        .checkbox-container input {
            display: none;
        }

        .checkbox-custom {
            width: 16px;
            height: 16px;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0d0a12;
            transition: all 0.2s;
        }

        .checkbox-container input:checked + .checkbox-custom {
            background: var(--accent-purple);
            border-color: #a78bfa;
            box-shadow: 0 0 6px rgba(139, 92, 246, 0.4);
        }

        .checkbox-container input:checked + .checkbox-custom::after {
            content: "\2713";
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
        }

        /* Goals Checklist List */
        .goals-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .goals-list {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 1200px) {
            .goals-list {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        .goal-card {
            background: rgba(13, 10, 18, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s;
            position: relative;
        }

        .goal-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transform: translateY(-1px);
        }

        .goal-card.completed {
            opacity: 0.5;
            border-color: rgba(255,255,255,0.05);
            background: rgba(9, 7, 12, 0.4);
        }

        .goal-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .goal-category {
            font-size: 0.6rem;
            font-weight: 800;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .goal-name {
            font-size: 0.85rem;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
        }

        .goal-card.completed .goal-name {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Displays cost inline */
        .goal-costs-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .goal-cost-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(13, 10, 18, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .cost-badge-orb { border-color: rgba(168, 85, 247, 0.2); color: var(--color-orb); }
        .cost-badge-flame { border-color: rgba(234, 88, 12, 0.2); color: #f97316; }
        .cost-badge-crystal { border-color: rgba(6, 182, 212, 0.2); color: var(--color-crystal); }
        .cost-badge-star { border-color: rgba(234, 179, 8, 0.2); color: var(--color-star); }

        .goal-actions {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .goal-btn-target {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
            user-select: none;
        }
        .goal-btn-target:hover {
            background: rgba(139, 92, 246, 0.2);
            color: #fff;
        }
        .goal-btn-target.active {
            background: rgba(139, 92, 246, 0.4);
            border-color: #a78bfa;
            color: #fff;
            box-shadow: 0 0 6px rgba(139, 92, 246, 0.3);
        }

        .goal-btn-done {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
            user-select: none;
        }
        .goal-btn-done:hover {
            border-color: rgba(16, 162, 65, 0.4);
            background: rgba(16, 162, 65, 0.05);
            color: #10a241;
        }
        .goal-card.completed .goal-btn-done {
            background: rgba(16, 162, 65, 0.2);
            border-color: #10a241;
            color: #fff;
        }

        /* Unlocked level badges on goal cards */
        .level-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 0.55rem;
            font-weight: 800;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--accent-purple);
            color: #a78bfa;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Notifications / Toast styling */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            background: #14101e;
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Keyframe animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 18px rgba(168, 85, 247, 0.6); }
        }

        @keyframes text-glow {
            0% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        /* Mobile specific enhancements for readability and finger-friendly tap targets */
        @media (max-width: 480px) {
            .goal-btn-target, .goal-btn-done {
                padding: 10px 16px;
                font-size: 0.8rem;
                min-height: 40px;
            }
            .goal-actions {
                gap: 12px;
            }
            .card-btn {
                width: 36px;
                height: 36px;
                font-size: 0.75rem;
            }
            .shortcut-btn {
                padding: 8px 10px;
                font-size: 0.75rem;
                min-height: 36px;
            }
            .inv-input {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- Sticky Header -->
    <header class="header">
        <div class="header-content">
            <div class="brand-container">
                <!-- SVG Nether Orb Glowing Logo -->
                <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#f3e8ff" />
                            <stop offset="35%" stop-color="#c084fc" />
                            <stop offset="85%" stop-color="#7e22ce" />
                            <stop offset="100%" stop-color="#3b0764" />

                <div class="brand-text">

                    <p>Costs Calculator for Idle Apocalypse</p>
                </div>
            </div>

            <!-- Toolbar Actions -->
            <div class="actions-toolbar">
                <button class="btn" onclick="exportData()" title="Download progress as JSON backup file">
                    <!-- Export SVG -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Export
                </button>
                <button class="btn" onclick="triggerImport()" title="Upload a JSON backup file to restore progress">
                    <!-- Import SVG -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Import
                </button>
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
                <button class="btn btn-danger" onclick="resetState()" title="Clear all local data and reset to defaults">
                    <!-- Reset SVG -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
                    Reset
                </button>
            </div>
        </div>
    </header>

    <div class="main-layout">
        
        <!-- Left Panel: Inventory, Modifiers & Calculator Output -->
        <div class="sticky-panel">
            
            <!-- Upgrades & Modifiers Panel -->

                <div class="panel-header">
                    <span class="panel-title">
                        <!-- Settings Icon SVG -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

                        <!-- Nether Pie Modifier -->
                        <div class="modifier-box">

                            </div>

                    </div>

                </div>
            </div>

            <!-- Creature Drop Yields Panel -->

                <div class="panel-header">
                    <span class="panel-title" style="color: #a78bfa; text-shadow: 0 0 8px rgba(168, 85, 247, 0.35);">

                    </span>
                </div>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;" id="dropRatesContainer">
                    <!-- JS generated drop rate cards -->
                </div>
            </div>

            <!-- Inventory Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">
                        <!-- Inventory Chest SVG -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></svg>
                        On-Hand Resources
                    </span>
                </div>

                </div>
            </div>

            <!-- Calculator Summary Panel -->

                <div class="panel-header">
                    <span class="panel-title" style="color: #c084fc; text-shadow: 0 0 8px rgba(168, 85, 247, 0.45);">
                        <!-- Portal / Sparkles SVG -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Nether Requirements
                    </span>
                </div>
                <div id="calculatorSummary">
                    <!-- Dynamic calculation outputs will render here -->
                </div>
            </div>

        </div>

        <!-- Right Panel: Checklist / Goals Catalog -->
        <div class="checklist-panel">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">
                        <!-- Checklist SVG -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11-2 2-2-2M9 17l-2 2-2-2M13 6h8M13 12h8M13 18h8"/></svg>
                        Target Goals Checklist
                    </span>
                </div>

                    <div class="filter-row" id="categoryTabs">
                        <button class="filter-tab active" onclick="setCategoryFilter('All')">All</button>
                        <button class="filter-tab" onclick="setCategoryFilter('Creatures')">Creatures</button>
                        <button class="filter-tab" onclick="setCategoryFilter('Scrolls')">Scrolls</button>

                        <button class="filter-tab" onclick="setCategoryFilter('Lesley')">Lesley</button>
                    </div>

                        <input type="text" class="search-input" id="searchBar" placeholder="Search targets by name..." oninput="handleSearch(this.value)">

                            <input type="checkbox" id="hideCompletedCheck" onchange="toggleHideCompleted(this.checked)">
                            <span class="checkbox-custom"></span>
                            Hide Completed
                        </label>
                    </div>
                </div>

                <!-- Goals Checklist Grid -->
                <div class="goals-list" id="goalsListContainer">

                </div>
            </div>
        </div>

        // --- 4. Application State Store ---
        let state = {

        // --- 5. Application Persistence Engine ---
        const STORAGE_KEY = "idle_apoc_nether_costs_state_v2";

        function saveStateToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error("Failed to save state to localStorage", e);
            }
        }

        function loadStateFromLocalStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state = { ...state, ...parsed };
                }
            } catch (e) {
                console.error("Failed to load state from localStorage", e);
            }
        }

        function resetState() {
            if (confirm("Are you sure you want to clear your current progress and reset everything?")) {
                state.onHand = { orbs: 0, flames: 0, crystals: 0, stars: 0 };
                state.completedGoals = {};
                state.selectedGoals = {};
                state.pieLevel = 0;
                state.bountyEnabled = false;
                state.hideCompleted = false;
                state.activeCategory = "All";
                state.searchQuery = "";
                
                saveStateToLocalStorage();
                renderAll();
                showToast("All progress reset to defaults.");
            }
        }

        // Backup Data
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "nether_costs_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("Backup file downloaded.");
        }

        function triggerImport() {
            document.getElementById("importFile").click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.onHand) {
                        state = { ...state, ...parsed };
                        saveStateToLocalStorage();
                        renderAll();
                        showToast("Progress successfully imported!");
                    } else {
                        alert("Invalid backup file format.");
                    }
                } catch (err) {
                    alert("Failed to parse JSON file.");
                }
            };
            reader.readAsText(file);
            event.target.value = "";
        }

        // --- 6. Core Calculations (Summon Cascade Math) ---
        
        // Dynamically compute creature stats: level and drop rate
        function getCreatureStats(creatureKey) {
            const creature = CREATURES_DATA[creatureKey];
            
            // Sync level based on checklist completions
            let level = 1;
            if (creatureKey === "netherling") {
                if (state.completedGoals["netherling_lvl_3"]) level = 3;
                else if (state.completedGoals["netherling_lvl_2"]) level = 2;
            } else if (creatureKey === "demon") {
                if (state.completedGoals["nether_demon_lvl_3"]) level = 3;
                else if (state.completedGoals["nether_demon_lvl_2"]) level = 2;
            } else if (creatureKey === "mountain") {
                if (state.completedGoals["mountain_lvl_2"]) level = 2;
            }
            
            const baseDrop = creature.baseDrops[level];
            const pieBonus = state.pieLevel;
            const bountyBonus = state.bountyEnabled ? 1 : 0;
            
            return {
                level: level,
                drop: baseDrop + pieBonus + bountyBonus
            };
        }

        function getCreatureDrop(creatureKey) {
            return getCreatureStats(creatureKey).drop;
        }

        function calculateCosts() {
            let targetOrbs = 0;
            let targetFlames = 0;
            let targetCrystals = 0;
            let targetStars = 0;

            TARGETS_DATA.forEach(goal => {
                if (state.selectedGoals[goal.id] && !state.completedGoals[goal.id]) {
                    targetOrbs += goal.cost.orbs;
                    targetFlames += goal.cost.flames;
                    targetCrystals += goal.cost.crystals;
                    targetStars += goal.cost.stars;
                }
            });

            const drops = {
                netherling: getCreatureDrop("netherling"),
                demon: getCreatureDrop("demon"),
                mountain: getCreatureDrop("mountain")
            };

            const explanation = [];

            // A. Star deficits -> Summon Mountains
            const initialStarDeficit = Math.max(0, targetStars - state.onHand.stars);
            let mountainsToSummon = 0;
            let starSurplus = 0;
            let mountainCrystalsCost = 0;
            
            if (initialStarDeficit > 0) {
                mountainsToSummon = Math.ceil(initialStarDeficit / drops.mountain);
                const starYield = mountainsToSummon * drops.mountain;
                starSurplus = starYield - initialStarDeficit;
                mountainCrystalsCost = mountainsToSummon * CREATURES_DATA.mountain.crystalCost;
                
                explanation.push(`Need <strong>${targetStars} Stars</strong>. On-hand: <strong>${state.onHand.stars}</strong>. Deficit: <strong>${initialStarDeficit}</strong>.<br>
                    Summon <strong>${mountainsToSummon} Mountain(s)</strong> (drops +${drops.mountain} each) yielding <strong>+${starYield} Stars</strong> (Surplus: +${starSurplus}).<br>
                    Mountain summons require <strong>${mountainCrystalsCost} Crystals</strong>.`);
            } else if (targetStars > 0) {
                explanation.push(`Need <strong>${targetStars} Stars</strong>. On-hand: <strong>${state.onHand.stars}</strong>. Covered completely.`);
            }

            // B. Crystal deficits -> Summon Demons
            const totalCrystalsNeeded = targetCrystals + mountainCrystalsCost;
            const initialCrystalDeficit = Math.max(0, totalCrystalsNeeded - state.onHand.crystals);
            let demonsToSummon = 0;
            let crystalSurplus = 0;
            let demonFlamesCost = 0;
            let demonOrbsCost = 0;

            if (initialCrystalDeficit > 0) {
                demonsToSummon = Math.ceil(initialCrystalDeficit / drops.demon);
                const crystalYield = demonsToSummon * drops.demon;
                crystalSurplus = crystalYield - initialCrystalDeficit;
                demonFlamesCost = demonsToSummon * CREATURES_DATA.demon.flameCost;
                demonOrbsCost = demonsToSummon * CREATURES_DATA.demon.orbCost;

                explanation.push(`Need <strong>${totalCrystalsNeeded} Crystals</strong> (${targetCrystals} goals + ${mountainCrystalsCost} summons). On-hand: <strong>${state.onHand.crystals}</strong>. Deficit: <strong>${initialCrystalDeficit}</strong>.<br>
                    Summon <strong>${demonsToSummon} Demon(s)</strong> (drops +${drops.demon} each) yielding <strong>+${crystalYield} Crystals</strong> (Surplus: +${crystalSurplus}).<br>
                    Demon summons require <strong>${demonFlamesCost} Flames</strong> and <strong>${demonOrbsCost} Orbs</strong>.`);
            } else if (totalCrystalsNeeded > 0) {
                explanation.push(`Need <strong>${totalCrystalsNeeded} Crystals</strong> (${targetCrystals} goals + ${mountainCrystalsCost} summons). On-hand: <strong>${state.onHand.crystals}</strong>. Covered completely.`);
            }

            // C. Flame deficits -> Summon Netherlings
            const totalFlamesNeeded = targetFlames + demonFlamesCost;
            const initialFlameDeficit = Math.max(0, totalFlamesNeeded - state.onHand.flames);
            let netherlingsToSummon = 0;
            let flameSurplus = 0;
            let netherlingOrbsCost = 0;

            if (initialFlameDeficit > 0) {
                netherlingsToSummon = Math.ceil(initialFlameDeficit / drops.netherling);
                const flameYield = netherlingsToSummon * drops.netherling;
                flameSurplus = flameYield - initialFlameDeficit;
                netherlingOrbsCost = netherlingsToSummon * CREATURES_DATA.netherling.orbCost;

                explanation.push(`Need <strong>${totalFlamesNeeded} Flames</strong> (${targetFlames} goals + ${demonFlamesCost} summons). On-hand: <strong>${state.onHand.flames}</strong>. Deficit: <strong>${initialFlameDeficit}</strong>.<br>
                    Summon <strong>${netherlingsToSummon} Netherling(s)</strong> (drops +${drops.netherling} each) yielding <strong>+${flameYield} Flames</strong> (Surplus: +${flameSurplus}).<br>
                    Netherling summons require <strong>${netherlingOrbsCost} Orbs</strong>.`);
            } else if (totalFlamesNeeded > 0) {
                explanation.push(`Need <strong>${totalFlamesNeeded} Flames</strong> (${targetFlames} goals + ${demonFlamesCost} summons). On-hand: <strong>${state.onHand.flames}</strong>. Covered completely.`);
            }

            // D. Orb deficits
            const totalOrbsNeeded = targetOrbs + demonOrbsCost + netherlingOrbsCost;
            const initialOrbDeficit = Math.max(0, totalOrbsNeeded - state.onHand.orbs);
            
            if (totalOrbsNeeded > 0) {
                explanation.push(`Need <strong>${totalOrbsNeeded} Orbs</strong> (${targetOrbs} goals + ${demonOrbsCost + netherlingOrbsCost} summons). On-hand: <strong>${state.onHand.orbs}</strong>.<br>
                    ${initialOrbDeficit > 0 ? `Deficit: <strong>${initialOrbDeficit} Orbs</strong> required.` : `Covered completely.`}`);
            }

            return {
                baseCosts: { orbs: targetOrbs, flames: targetFlames, crystals: targetCrystals, stars: targetStars },
                summons: { netherling: netherlingsToSummon, demon: demonsToSummon, mountain: mountainsToSummon },
                deficits: { orbs: initialOrbDeficit, flames: initialFlameDeficit, crystals: initialCrystalDeficit, stars: initialStarDeficit },
                totalNeeded: { orbs: totalOrbsNeeded, flames: totalFlamesNeeded, crystals: totalCrystalsNeeded, stars: targetStars },
                explanation
            };
        }

        // --- 7. DOM Rendering Layouts ---

        // Render Inventory on main panel
        function renderInventory() {
            const container = document.getElementById("inventoryContainer");
            const keys = [
                { key: 'orbs', label: 'Nether Orbs', icon: ICONS.orb, class: 'inv-orb' },
                { key: 'flames', label: 'Nether Flames', icon: ICONS.flame, class: 'inv-flame' },
                { key: 'crystals', label: 'Nether Crystals', icon: ICONS.crystal, class: 'inv-crystal' },
                { key: 'stars', label: 'Nether Stars', icon: ICONS.star, class: 'inv-star' }
            ];

            container.innerHTML = keys.map(item => `
                <div class="inventory-card ${item.class}">
                    <div class="card-header-row">
                        <span>${item.label}</span>
                        <img class="resource-icon" src="${item.icon}" alt="${item.label}">
                    </div>
                    <div class="card-controls">
                        <button class="card-btn" onclick="updateInventory('${item.key}', -10)" title="-10">-10</button>
                        <button class="card-btn" onclick="updateInventory('${item.key}', -1)" title="-1">-1</button>
                        <input type="number" class="inv-input mono-num" value="${state.onHand[item.key]}" 
                            onchange="setInventory('${item.key}', this.value)" min="0">
                        <button class="card-btn" onclick="updateInventory('${item.key}', 1)" title="+1">+1</button>
                        <button class="card-btn" onclick="updateInventory('${item.key}', 10)" title="+10">+10</button>
                    </div>
                    ${renderShortcuts(item.key)}
                </div>
            `).join('');
        }

        // Render Quick Action Buttons for summoning costs and creature drops
        function renderShortcuts(key) {
            if (key === 'orbs') {
                return `
                    <div class="card-shortcuts">
                        <button class="shortcut-btn" onclick="updateInventory('orbs', -3)" title="Summon Demon (-3 Orbs)">
                            -3 (Demon)
                        </button>
                    </div>
                `;
            } else if (key === 'flames') {
                const drop = getCreatureDrop('netherling');
                return `
                    <div class="card-shortcuts">
                        <button class="shortcut-btn" onclick="updateInventory('flames', ${drop})" title="Netherling Drop (+${drop} Flames)">
                            +${drop} (Netherling)
                        </button>
                        <button class="shortcut-btn" onclick="updateInventory('flames', -10)" title="Summon Demon (-10 Flames)">
                            -10 (Demon)
                        </button>
                    </div>
                `;
            } else if (key === 'crystals') {
                const drop = getCreatureDrop('demon');
                return `
                    <div class="card-shortcuts">
                        <button class="shortcut-btn" onclick="updateInventory('crystals', ${drop})" title="Nether Demon Drop (+${drop} Crystals)">
                            +${drop} (Demon)
                        </button>
                        <button class="shortcut-btn" onclick="updateInventory('crystals', -12)" title="Summon Mountain (-12 Crystals)">
                            -12 (Mountain)
                        </button>
                    </div>
                `;
            } else if (key === 'stars') {
                const drop = getCreatureDrop('mountain');
                return `
                    <div class="card-shortcuts">
                        <button class="shortcut-btn" onclick="updateInventory('stars', ${drop})" title="Nether Mountain Drop (+${drop} Stars)">
                            +${drop} (Mountain)
                        </button>
                    </div>
                `;
            }
            return '';
        }

        // Render Collapsible Modifiers Panel (and Creature Drop Rates)
        function renderUpgradesPanel() {
            document.getElementById("pieLevelVal").innerText = state.pieLevel;
            document.getElementById("pieLevelInput").value = state.pieLevel;
            
            const btn = document.getElementById("bountyToggle");
            if (state.bountyEnabled) {
                btn.classList.add("active");
                btn.innerText = "Enabled (+1)";
            } else {
                btn.classList.remove("active");
                btn.innerText = "Disabled";
            }

            // Render Dynamic Creature Drop Rates inside settings
            const ratesContainer = document.getElementById("dropRatesContainer");
            const creatures = [
                { key: 'netherling', label: 'Netherling', icon: ICONS.netherling, unit: 'Flames', color: 'var(--color-flame)', class: 'drop-card-netherling' },
                { key: 'demon', label: 'Nether Demon', icon: ICONS.demon, unit: 'Crystals', color: 'var(--color-crystal)', class: 'drop-card-demon' },
                { key: 'mountain', label: 'Mountain', icon: ICONS.mountain, unit: 'Stars', color: 'var(--color-star)', class: 'drop-card-mountain' }
            ];

            ratesContainer.innerHTML = creatures.map(c => {
                const stats = getCreatureStats(c.key);
                return `
                    <div class="creature-drop-card ${c.class}">
                        <img src="${c.icon}" style="width: 24px; height: 24px; object-fit: contain;" alt="${c.label}">
                        <span style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted);">${c.label} (Lvl ${stats.level})</span>
                        <span style="font-size: 0.85rem; font-weight: 800; color: ${c.color};" class="mono-num">${stats.drop} ${c.unit}</span>
                    </div>
                `;
            }).join('');
        }

        // Render Calculator calculations output
        function renderCalculatorSummary() {
            const container = document.getElementById("calculatorSummary");
            const results = calculateCosts();

            const activeTargetsCount = Object.keys(state.selectedGoals).filter(k => state.selectedGoals[k] && !state.completedGoals[k]).length;
            
            if (activeTargetsCount === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.8rem;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px; opacity: 0.5;"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
                        <p>No active targets selected.</p>
                        <p style="font-size: 0.7rem; margin-top: 4px;">Select one or multiple goals in the checklist below to calculate summoning costs.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <!-- Creature Summons Grid -->
                <div class="results-section-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Summons Needed
                </div>
                <div class="summons-grid">
                    <div class="summon-item">
                        <img class="summon-creature-icon" src="${CREATURES_DATA.netherling.icon}" alt="Netherling">
                        <span class="summon-count mono-num">${results.summons.netherling}</span>
                        <span class="summon-name">Netherlings</span>
                        <span style="font-size:0.55rem; color:#a78bfa; font-weight:700;">(+${getCreatureDrop("netherling")} drops)</span>
                    </div>
                    <div class="summon-item">
                        <img class="summon-creature-icon" src="${CREATURES_DATA.demon.icon}" alt="Nether Demon">
                        <span class="summon-count mono-num">${results.summons.demon}</span>
                        <span class="summon-name">Demons</span>
                        <span style="font-size:0.55rem; color:#a78bfa; font-weight:700;">(+${getCreatureDrop("demon")} drops)</span>
                    </div>
                    <div class="summon-item">
                        <img class="summon-creature-icon" src="${CREATURES_DATA.mountain.icon}" alt="Nether Mountain">
                        <span class="summon-count mono-num">${results.summons.mountain}</span>
                        <span class="summon-name">Mountains</span>
                        <span style="font-size:0.55rem; color:#a78bfa; font-weight:700;">(+${getCreatureDrop("mountain")} drops)</span>
                    </div>
                </div>

                <!-- Deficits / Resource Grid -->
                <div class="results-section-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11.5 21a9.5 9.5 0 1 0 0-19 9.5 9.5 0 0 0 0 19z"/><path d="M12.5 7v6h4"/></svg>
                    Additional Resource Deficit
                </div>
                <div class="deficits-grid">
                    <div class="deficit-item ${results.deficits.orbs > 0 ? 'deficit-active def-orb' : ''}">
                        <span class="deficit-val mono-num">${results.deficits.orbs}</span>
                        <span class="deficit-label">Orbs</span>
                    </div>
                    <div class="deficit-item ${results.deficits.flames > 0 ? 'deficit-active def-flame' : ''}">
                        <span class="deficit-val mono-num">${results.deficits.flames}</span>
                        <span class="deficit-label">Flames</span>
                    </div>
                    <div class="deficit-item ${results.deficits.crystals > 0 ? 'deficit-active def-crystal' : ''}">
                        <span class="deficit-val mono-num">${results.deficits.crystals}</span>
                        <span class="deficit-label">Crystals</span>
                    </div>
                    <div class="deficit-item ${results.deficits.stars > 0 ? 'deficit-active def-star' : ''}">
                        <span class="deficit-val mono-num">${results.deficits.stars}</span>
                        <span class="deficit-label">Stars</span>
                    </div>
                </div>

                <!-- Cascade Math Log -->
                <div class="results-section-title">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    Cascading Calculation Log
                </div>
                <div class="explanation-box">
                    ${results.explanation.map(step => `<div class="explanation-step">${step}</div>`).join('')}
                </div>
            `;
        }

        // Render Goals Checklist Grid
        function renderGoalsList() {
            const container = document.getElementById("goalsListContainer");
            
            const filtered = TARGETS_DATA.filter(goal => {
                if (state.activeCategory !== "All" && goal.category !== state.activeCategory) {
                    return false;
                }
                if (state.searchQuery && !goal.name.toLowerCase().includes(state.searchQuery.toLowerCase())) {
                    return false;
                }
                if (state.hideCompleted && state.completedGoals[goal.id]) {
                    return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.4; margin-bottom: 8px;"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <p>No matching goals found.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(goal => {
                const isCompleted = !!state.completedGoals[goal.id];
                const isSelected = !!state.selectedGoals[goal.id];
                
                let costsHtml = "";
                if (goal.cost.orbs > 0) costsHtml += `<span class="goal-cost-badge cost-badge-orb"><img class="resource-icon" src="${ICONS.orb}"> ${goal.cost.orbs}</span>`;
                if (goal.cost.flames > 0) costsHtml += `<span class="goal-cost-badge cost-badge-flame"><img class="resource-icon" src="${ICONS.flame}"> ${goal.cost.flames}</span>`;
                if (goal.cost.crystals > 0) costsHtml += `<span class="goal-cost-badge cost-badge-crystal"><img class="resource-icon" src="${ICONS.crystal}"> ${goal.cost.crystals}</span>`;
                if (goal.cost.stars > 0) costsHtml += `<span class="goal-cost-badge cost-badge-star"><img class="resource-icon" src="${ICONS.star}"> ${goal.cost.stars}</span>`;

                let levelBadge = "";
                if (goal.id === "netherling_lvl_2") levelBadge = `<span class="level-badge">Netherling Lvl 2</span>`;
                else if (goal.id === "netherling_lvl_3") levelBadge = `<span class="level-badge">Netherling Lvl 3</span>`;
                else if (goal.id === "nether_demon_lvl_2") levelBadge = `<span class="level-badge">Demon Lvl 2</span>`;
                else if (goal.id === "nether_demon_lvl_3") levelBadge = `<span class="level-badge">Demon Lvl 3</span>`;
                else if (goal.id === "mountain_lvl_2") levelBadge = `<span class="level-badge">Mountain Lvl 2</span>`;

                return `
                    <div class="goal-card ${isCompleted ? 'completed' : ''}">
                        ${levelBadge}
                        <div class="goal-info">
                            <span class="goal-category">${goal.category}</span>
                            <span class="goal-name">${goal.name}</span>
                            ${goal.description ? `<span class="goal-desc" style="font-size: 0.65rem; color: var(--text-muted); font-style: italic; margin-top: 2px; line-height: 1.25;">${goal.description}</span>` : ''}
                        </div>
                        <div class="goal-costs-row">
                            ${costsHtml || '<span style="font-size:0.65rem; color:gray;">Free/None</span>'}
                        </div>
                        <div class="goal-actions">
                            <button class="goal-btn-target ${isSelected && !isCompleted ? 'active' : ''}" 
                                onclick="toggleGoalSelected('${goal.id}')" ${isCompleted ? 'disabled' : ''}>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
                                Target
                            </button>
                            <button class="goal-btn-done" onclick="toggleGoalCompleted('${goal.id}')">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                Achieved
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderAll() {
            renderInventory();
            renderUpgradesPanel();
            renderCalculatorSummary();
            renderGoalsList();
        }

        // --- 8. Event Action Handlers ---

        function updateInventory(key, delta) {
            state.onHand[key] = Math.max(0, state.onHand[key] + delta);
            saveStateToLocalStorage();
            renderInventory();
            renderCalculatorSummary();
        }

        function setInventory(key, val) {
            state.onHand[key] = Math.max(0, parseInt(val) || 0);
            saveStateToLocalStorage();
            renderInventory();
            renderCalculatorSummary();
        }

        function updatePieLevel(val) {
            state.pieLevel = parseInt(val) || 0;
            document.getElementById("pieLevelVal").innerText = state.pieLevel;
            saveStateToLocalStorage();
            renderUpgradesPanel();
            renderCalculatorSummary();
            renderInventory(); // Refresh shortcut drop rate labels
        }

        function toggleBounty() {
            state.bountyEnabled = !state.bountyEnabled;
            saveStateToLocalStorage();
            renderUpgradesPanel();
            renderCalculatorSummary();
            renderInventory(); // Refresh shortcut drop rate labels
        }

        function toggleModifiers() {
            const panel = document.getElementById("modifiersPanel");
            const btn = document.getElementById("modifiersToggle");
            
            state.modifiersExpanded = !state.modifiersExpanded;
            saveStateToLocalStorage();

            if (state.modifiersExpanded) {
                panel.classList.add("expanded");
                btn.innerHTML = "Collapse <span>&#9650;</span>";
            } else {
                panel.classList.remove("expanded");
                btn.innerHTML = "Expand <span>&#9660;</span>";
            }
        }

        function setCategoryFilter(category) {
            state.activeCategory = category;
            
            const tabs = document.querySelectorAll("#categoryTabs .filter-tab");
            tabs.forEach(tab => {
                if (tab.innerText === category) {
                    tab.classList.add("active");
                } else {
                    tab.classList.remove("active");
                }
            });

            saveStateToLocalStorage();
            renderGoalsList();
        }

        function handleSearch(val) {
            state.searchQuery = val.trim();
            saveStateToLocalStorage();
            renderGoalsList();
        }

        function toggleHideCompleted(checked) {
            state.hideCompleted = checked;
            saveStateToLocalStorage();
            renderGoalsList();
        }

        function toggleGoalSelected(id) {
            state.selectedGoals[id] = !state.selectedGoals[id];
            saveStateToLocalStorage();
            renderGoalsList();
            renderCalculatorSummary();
        }

        function toggleGoalCompleted(id) {
            state.completedGoals[id] = !state.completedGoals[id];
            
            if (state.completedGoals[id]) {
                state.selectedGoals[id] = false;
            }

            saveStateToLocalStorage();
            renderGoalsList();
            renderCalculatorSummary();
            renderUpgradesPanel(); // Always refresh drops panel on any checklist achievements
            renderInventory(); // Refresh shortcut drop rate labels
        }

        // Action Toast Notification Banner
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById("toastNotification");
            document.getElementById("toastMessage").innerHTML = message;
            
            toast.classList.add("visible");
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove("visible");
            }, 3000);
        }

        // --- 9. Initializer ---
        window.addEventListener("DOMContentLoaded", () => {
            loadStateFromLocalStorage();
            
            // Set App Version in UI
            document.getElementById("app-version").textContent = APP_VERSION;
            
            const panel = document.getElementById("modifiersPanel");
            const btn = document.getElementById("modifiersToggle");
            if (state.modifiersExpanded) {
                panel.classList.add("expanded");
                btn.innerHTML = "Collapse <span>&#9650;</span>";
            } else {
                panel.classList.remove("expanded");
                btn.innerHTML = "Expand <span>&#9660;</span>";
            }

            document.getElementById("hideCompletedCheck").checked = state.hideCompleted;
            
            renderAll();
        });
    </script>
</body>
</html>
